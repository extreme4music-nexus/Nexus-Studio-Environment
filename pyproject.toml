[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-studio-environment"
version = "0.1.0"
description = "Python-first modular Nexus Studio Environment"
requires-python = ">=3.12"

[project.scripts]
nexus-runtime = "nse_runtime.__main__:main"

[tool.setuptools.packages.find]
where = ["modules"]
include = ["nse_*"]
namespaces = false
