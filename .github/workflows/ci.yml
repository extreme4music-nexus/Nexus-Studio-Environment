name: module-runtime-checks
on: [push, pull_request]
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[ui]"
      - run: python -B -m unittest discover -s tests -v
      - run: python -B -m nse_runtime validate --config examples/runtime-demo.json
      - run: python -B -m nse_runtime demo
      - run: python -B examples/workspace-smoke.py
      - run: nexus-workspace --help
      - run: nexus-studio --help
      - run: python -B examples/studio-preview.py --output studio-preview.png
